[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "packaging-outreach"
version = "0.1.0"
description = "Agent-independent personalized packaging outreach: research, varied AB concepts, and resumable email delivery"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Alexanderhe1212"}]
dependencies = []

[project.scripts]
packaging-outreach = "packaging_outreach.cli:main"

[tool.setuptools.packages.find]
include = ["packaging_outreach*"]
