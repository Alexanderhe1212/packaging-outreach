<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开发工作台</title><style>
:root{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#183b39;background:#f4f7f6}body{margin:0}main{max-width:1200px;margin:auto;padding:32px 24px}header{display:flex;align-items:center;justify-content:space-between}a{color:#176b5b}h1{font-size:28px;margin-bottom:8px}.hint{color:#657b76;line-height:1.7}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}label{display:grid;gap:6px;font-size:13px}input,select,button{padding:10px;border:1px solid #cbd9d4;border-radius:8px;background:white;color:inherit}button{background:#176b5b;color:white;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card,section{background:white;border:1px solid #e0e9e5;border-radius:14px;padding:20px;margin-bottom:16px}.count{font-size:32px;font-weight:650;margin:10px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #edf1ef}#error{color:#9c342b}pre{white-space:pre-wrap}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #a5cfbd}h2{font-size:18px}footer{color:#657b76;margin-top:20px}</style><main><header><div><h1>客户开发工作台</h1><div class="hint">从发现公司到有效询盘，每一步都可核对。</div></div><a href="/">返回应用</a></header><form id="filters" class="filters"><label>统计天数<select name="days"><option>7</option><option>30</option><option>90</option></select></label><label>账号<input name="account" placeholder="全部"></label><label>地区<input name="region" placeholder="全部"></label><label>档位<input name="tier" placeholder="A / B / C"></label><label>关键词<input name="keyword" placeholder="全部"></label><label>文案变体<input name="variant" placeholder="全部"></label><button>更新统计</button></form><p id="error" role="alert"></p><div id="stages" class="grid"></div><section><h2>回复分类</h2><div id="replies" class="grid"></div><p id="sample" class="hint"></p></section><section><h2>主要卡点</h2><table><thead><tr><th>原因</th><th>次数</th></tr></thead><tbody id="failures"></tbody></table></section><section><h2>有效询盘</h2><div id="inquiries"></div></section><section><h2>转介绍联系人 · 待核实</h2><div id="referrals"></div><p class="hint">转介绍地址不是官网核实邮箱，不直接进入发送。</p></section><footer id="note"></footer></main><script>
const $=s=>document.querySelector(s);function card(label,count,detail){const e=document.createElement('div');e.className='card';for(const [text,cls] of [[label,''],[count,'count'],[detail,'hint']]){const p=document.createElement('div');p.className=cls;p.textContent=text;e.append(p)}return e}
const names={auto_reply:'自动回复',bounce:'退信',unsubscribe:'退订',human_interested:'有意向',human_not_interested:'无意向',human_referral:'转介绍',human_other:'其他真人回复'};
async function load(e){if(e)e.preventDefault();try{const r=await fetch('/api/funnel?'+new URLSearchParams(new FormData($('#filters'))));if(!r.ok)throw Error('无法读取统计');const d=await r.json();$('#error').textContent='';$('#stages').replaceChildren(...d.stages.map(x=>card(x.label,x.count,x.median_ms===null?'耗时未测量':'中位耗时 '+Math.round(x.median_ms)+' ms')));$('#replies').replaceChildren(...Object.entries(names).map(([k,v])=>card(v,d.replies[k]||0,'')),card('历史未分类',d.historical_unclassified,'不回填为真人回复'));$('#sample').textContent=d.variant_status;$('#failures').replaceChildren(...d.top_failures.map(([reason,n])=>{const tr=document.createElement('tr');for(const v of [reason,n]){const td=document.createElement('td');td.textContent=v;tr.append(td)}return tr}));$('#inquiries').replaceChildren(...d.inquiries.map(x=>card(x.company,x.account,x.reply_excerpt)));$('#referrals').replaceChildren(...d.referrals.map(x=>card(x.email,x.account,'待核实身份与公开来源')));$('#note').textContent=d.note}catch(err){$('#error').textContent=err.message}}
$('#filters').addEventListener('submit',load);load();
</script></html>
