<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OutreachPilot</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--panel2:#f0f2f5;--line:#e3e6ea;--text:#16191d;--muted:#6b7280;--accent:#0f766e;--accent2:#14b8a6;--warn:#b45309;--bad:#b91c1c;--good:#15803d;--blue:#1d4ed8;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1013;--panel:#16191e;--panel2:#1d2127;--line:#2a2f37;--text:#e8eaed;--muted:#9aa1ab;--accent:#2dd4bf;--accent2:#14b8a6;--warn:#f59e0b;--bad:#f87171;--good:#4ade80;--blue:#60a5fa;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){button.primary{color:#062723}}
button.ghost{background:transparent;border-color:transparent}
button.small{padding:3px 9px;font-size:12px}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
textarea{resize:vertical;min-height:70px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 22px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent2),#6366f1);display:grid;place-items:center;color:#fff;font-style:normal;font-size:15px}
.ver{font-size:11px;color:var(--muted);font-weight:400}
.spacer{flex:1}
main{padding:18px 22px 60px;max-width:1440px;margin:0 auto}
.banner{background:color-mix(in srgb,var(--warn) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);padding:10px 14px;border-radius:10px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.acc-head{display:flex;align-items:center;gap:10px}
.acc-name{font-weight:700;font-size:16px}
.muted{color:var(--muted)}
.pill{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.pill.run{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.activity{margin:10px 0;font-size:13px;color:var(--muted);min-height:20px;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:var(--good);box-shadow:0 0 0 0 var(--good);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.err{color:var(--bad);font-size:12px;margin-top:-4px;margin-bottom:8px;word-break:break-word}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 12px}
.kpi{background:var(--panel2);border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--muted)}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.strip{display:flex;gap:22px;flex-wrap:wrap;align-items:baseline;margin:16px 0}
.strip div b{font-size:20px;font-variant-numeric:tabular-nums}
.strip div span{display:block;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:none;background:transparent;color:var(--muted);border-radius:8px}
.tabs button.on{background:var(--panel2);color:var(--text);font-weight:600}
.tabs button em{font-style:normal;font-size:11px;margin-left:4px;color:var(--muted)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel2)}
tr.sel{background:color-mix(in srgb,var(--accent) 10%,transparent)!important}
.st{font-size:12px;padding:2px 8px;border-radius:6px;white-space:nowrap;background:var(--panel2)}
.st.ready{color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,transparent)}
.st.sent{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.st.replied{color:#fff;background:var(--accent)}
.st.failed,.st.bounced{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.st.unknown,.st.unsubscribed{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.st.work{color:var(--accent)}
.co b{display:block}
.co small{color:var(--muted)}
.subj{max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:20;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s;box-shadow:-10px 0 30px rgba(0,0,0,.12)}
.drawer.open{transform:none}
.dhead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dbody{flex:1;overflow:auto;padding:16px 18px}
iframe{width:100%;height:560px;border:1px solid var(--line);border-radius:10px;background:#fff}
.facts{font-size:13px;display:grid;grid-template-columns:110px 1fr;gap:4px 12px;margin:12px 0}
.facts dt{color:var(--muted)}
.facts dd{margin:0;word-break:break-word}
.reply{white-space:pre-wrap;background:color-mix(in srgb,var(--accent) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:10px;padding:12px;margin-bottom:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:none;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto}
.modal.open{display:flex}
.mbox{background:var(--panel);border-radius:16px;width:min(980px,100%);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mhead{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px}
.mbody{padding:16px 18px;max-height:74vh;overflow:auto}
.mfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 14px}
.form label{font-size:12px;color:var(--muted);display:block}
.form label > *{margin-top:4px}
.form .wide{grid-column:1/-1}
fieldset{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 14px}
legend{padding:0 6px;font-weight:600}
.hint{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw}
.toast.show{opacity:1}
.stage{display:grid;grid-template-columns:120px 1fr 1fr 1.4fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.stage:last-child{border:none}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text)}
.chk input{width:auto}
.empty{padding:40px;text-align:center;color:var(--muted)}
.spin{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:720px){header{padding:10px 14px}main{padding:14px}.kpis{grid-template-columns:repeat(2,1fr)}.stage{grid-template-columns:1fr}.subj,.hide-sm{display:none}}
</style>
</head>
<body>
<header>
  <div class="logo"><i>✈</i>OutreachPilot <span class="ver" id="ver"></span></div>
  <div class="spacer"></div>
  <button class="primary" onclick="ctl('start')">▶ 全部开始</button>
  <button onclick="ctl('pause')">⏸ 全部暂停</button>
  <button onclick="openAdd()">＋ 添加客户</button>
  <button onclick="openSettings()">⚙ 设置</button>
  <button class="ghost" title="退出后台服务" onclick="quitApp()">⏻</button>
</header>
<main>
  <div id="banner"></div>
  <div class="grid" id="accounts"></div>
  <div class="strip" id="strip"></div>
  <div class="card" style="padding:10px 6px">
    <div class="row" style="padding:0 8px 8px;justify-content:space-between">
      <div class="tabs" id="tabs"></div>
      <div class="row" style="flex-wrap:nowrap">
        <select id="facc" onchange="loadLeads(true)" style="width:auto"></select>
        <input id="fq" placeholder="搜索公司 / 邮箱 / 主题" oninput="clearTimeout(window._q);window._q=setTimeout(()=>loadLeads(true),300)" style="width:220px">
      </div>
    </div>
    <table><thead><tr><th>客户</th><th class="hide-sm">邮箱</th><th class="subj">主题</th><th>状态</th><th class="hide-sm">成本</th><th>更新</th></tr></thead>
      <tbody id="leads"></tbody></table>
    <div class="row" style="justify-content:center;padding:10px" id="pager"></div>
  </div>
</main>

<div class="drawer" id="drawer"><div class="dhead"><b id="dtitle" style="flex:1"></b><button class="ghost" onclick="closeDrawer()">✕</button></div><div class="dbody" id="dbody"></div></div>

<div class="modal" id="addModal"><div class="mbox" style="width:min(620px,100%)">
  <div class="mhead"><b style="flex:1">添加客户</b><button class="ghost" onclick="closeModal('addModal')">✕</button></div>
  <div class="mbody"><div class="form">
    <label>用哪个账号开发<select id="addAcc"></select></label>
    <label>邮箱（可选，只加一家时有效）<input id="addEmail" placeholder="hello@brand.com"></label>
    <label class="wide">客户官网或邮箱，每行一个（可一次粘贴很多）<textarea id="addUrls" rows="7" placeholder="https://brand.com&#10;anotherbrand.co.uk&#10;hello@thirdbrand.com"></textarea></label>
    <label class="chk wide"><input type="checkbox" id="addForce"> 即使联系过也添加（不会跳过退订 / 退信）</label>
  </div><p class="hint">系统会读取官网的公开邮箱和主推产品，写邮件、生成 A/B 图，然后按账号设置发送或等你审核。</p></div>
  <div class="mfoot"><button onclick="closeModal('addModal')">取消</button><button class="primary" onclick="doAdd()">添加</button></div>
</div></div>

<div class="modal" id="setModal"><div class="mbox">
  <div class="mhead"><b>设置</b><div class="tabs" id="stabs" style="margin-left:14px"></div><div class="spacer"></div><button class="ghost" onclick="closeModal('setModal')">✕</button></div>
  <div class="mbody" id="sbody"></div>
  <div class="mfoot"><span class="hint" style="flex:1">密钥只保存在本机 <code id="ddir"></code>（权限 600），不会上传 GitHub。</span><button onclick="closeModal('setModal')">关闭</button><button class="primary" id="saveBtn" onclick="saveSettings()">保存</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s), E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={queued:'排队中',researching:'读官网',writing:'写邮件',imaging:'生成图',ready:'待发送',sent:'已发送',unknown:'结果未知',replied:'已回复',failed:'失败',skipped:'已跳过',bounced:'退信',unsubscribed:'退订'};
const TABS=[['','全部'],['queued,researching,writing,imaging','准备中'],['ready','待发送'],['sent,unknown','已发送'],['replied','已回复'],['failed,skipped,bounced,unsubscribed','失败/退订']];
let S={state:null,status:'',offset:0,limit:60,lead:null,settings:null,stab:'api',editing:false};
async function api(path,data){const r=await fetch(path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok||j.error)throw new Error(j.error||r.status);return j}
function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),ms)}
const ago=ts=>{if(!ts)return'';const s=Date.now()/1000-ts;return s<60?'刚刚':s<3600?Math.floor(s/60)+' 分钟前':s<86400?Math.floor(s/3600)+' 小时前':new Date(ts*1000).toLocaleDateString()};
const money=v=>v?'$'+(v<0.01?v.toFixed(4):v.toFixed(3)):'—';

async function ctl(what,account){try{await api('/api/'+what,account?{account}:{});toast(what==='start'?'已开始':'已暂停');refresh()}catch(e){toast(e.message)}}
async function quitApp(){if(!confirm('退出后台服务？发送和准备都会停止，下次打开从原处继续。'))return;await api('/api/quit',{});document.body.innerHTML='<div class="empty">OutreachPilot 已退出，可以关闭这个窗口。</div>'}

async function refresh(){
  try{S.state=await api('/api/state')}catch(e){$('#banner').innerHTML='<div class="banner">后台服务没有响应：'+E(e.message)+'</div>';return}
  const st=S.state;$('#ver').textContent='v'+st.version;$('#ddir').textContent=st.data_dir;
  let b='';if(!st.api_ready)b+='<div class="banner">第一步：点右上角 <b>⚙ 设置 → AI 接口</b>，选择服务商并填写 API Key，点「测试」通过后保存。</div>';
  if((st.legacy_running||[]).length)b+=`<div class="banner">⚠ 检测到旧版开发信程序仍在运行（端口 ${st.legacy_running.join(', ')}）。为避免同一个邮箱被两套程序同时发信，请先关闭旧程序的终端窗口，再点「开始」。</div>`;
  if(!st.accounts.length)b+='<div class="banner">还没有发信账号：在 <b>⚙ 设置 → 账号</b> 里添加。</div>';
  $('#banner').innerHTML=b;
  $('#accounts').innerHTML=st.accounts.map(a=>{const s=a.stats,lim=a.daily_limit,pct=lim?Math.min(100,100*(s.sent_today||0)/lim):0;
    const working=['queued','researching','writing','imaging'].reduce((n,k)=>n+(s[k]||0),0);
    return `<div class="card"><div class="acc-head"><span class="acc-name">${E(a.name)}</span><span class="pill ${a.paused?'':'run'}">${a.paused?'已暂停':'运行中'}</span>
      <span class="muted" style="font-size:12px">${E(a.sender)}</span><div class="spacer"></div>
      ${a.paused?`<button class="primary small" onclick="ctl('start','${a.id}')">开始</button>`:`<button class="small" onclick="ctl('pause','${a.id}')">暂停</button>`}</div>
      <div class="activity"><span class="dot ${a.paused?'':'live'}"></span>${E(a.activity||'—')}</div>${a.error?`<div class="err">${E(a.error)}</div>`:''}
      <div class="kpis"><div class="kpi"><b>${s.sent_today||0}<small class="muted" style="font-size:12px">/${lim||'不限'}</small></b><span>今日已发</span><div class="bar"><i style="width:${pct}%"></i></div></div>
      <div class="kpi"><b>${s.ready||0}</b><span>待发送${a.auto_send?'':'（审核）'}</span></div><div class="kpi"><b>${s.replied||0}</b><span>已回复</span></div>
      <div class="kpi"><b>${money(s.cost_today)}</b><span>今日 AI 费用</span></div></div>
      <div class="row muted" style="font-size:12px;gap:14px"><span>准备中 ${working}</span><span>候选池 ${s.candidates||0}</span><span>累计发送 ${(s.sent||0)+(s.unknown||0)+(s.replied||0)}</span><span>${Math.round((s.tokens_today||0)/1000)}k tokens 今日</span>
      <div class="spacer"></div><button class="small" onclick="openAdd('${a.id}')">＋ 添加客户</button></div></div>`}).join('');
  const sel=$('#facc'),cur=sel.value;sel.innerHTML='<option value="">全部账号</option>'+st.accounts.map(a=>`<option value="${a.id}">${E(a.name)}</option>`).join('');sel.value=cur;
}

async function loadUsage(){
  try{const u=await api('/api/usage?days=7');const tot=u.rows.reduce((t,r)=>({c:t.c+r.cost,i:t.i+r.input+r.output,img:t.img+r.images,calls:t.calls+r.calls}),{c:0,i:0,img:0,calls:0});
    const pe=u.per_email||{};
    $('#strip').innerHTML=`<div><b>${pe.tokens?Math.round(pe.tokens).toLocaleString():'—'}</b><span>每封邮件平均 tokens（7 天）</span></div>
      <div><b>${pe.cost?money(pe.cost):'—'}</b><span>每封邮件平均成本（含生图）</span></div>
      <div><b>${money(tot.c)}</b><span>近 7 天 AI 费用（估算）</span></div><div><b>${tot.calls}</b><span>近 7 天 AI 调用次数</span></div><div><b>${tot.img}</b><span>近 7 天效果图</span></div>`}catch(e){}
}

async function loadLeads(reset){
  if(reset)S.offset=0;
  const q=new URLSearchParams({status:S.status,account:$('#facc').value,q:$('#fq').value,limit:S.limit,offset:S.offset});
  const r=await api('/api/leads?'+q);
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="${S.status===k?'on':''}" onclick="S.status='${k}';loadLeads(true)">${l}</button>`).join('');
  $('#leads').innerHTML=r.items.length?r.items.map(l=>{const work=['queued','researching','writing','imaging'].includes(l.status);
    return `<tr onclick="openLead(${l.id})" class="${S.lead===l.id?'sel':''}"><td class="co"><b>${E(l.company||l.domain)}</b><small>${E(l.account)} · ${E(l.domain)}</small></td>
    <td class="hide-sm">${E(l.email)}</td><td class="subj" title="${E(l.subject)}">${E(l.subject)||'<span class="muted">—</span>'}</td>
    <td><span class="st ${work?'work':l.status}">${work?'<span class="spin" style="display:inline-block;vertical-align:-2px;margin-right:4px;width:10px;height:10px"></span>':''}${ST[l.status]||l.status}</span>${l.followups?' <span class="pill">已跟进</span>':''}${l.error&&l.status==='failed'?`<div class="err" style="margin:4px 0 0">${E(l.error).slice(0,80)}</div>`:''}</td>
    <td class="hide-sm muted">${money(l.cost)}</td><td class="muted" style="white-space:nowrap">${ago(l.reply_at||l.sent_at||l.updated_at)}</td></tr>`}).join(''):'<tr><td colspan="6" class="empty">还没有记录。点「开始」后，系统会自动寻找客户。</td></tr>';
  const pages=Math.ceil(r.total/S.limit),page=S.offset/S.limit+1;
  $('#pager').innerHTML=pages>1?`<button class="small" ${page<=1?'disabled':''} onclick="S.offset-=S.limit;loadLeads()">上一页</button><span class="muted">${page} / ${pages}（共 ${r.total}）</span><button class="small" ${page>=pages?'disabled':''} onclick="S.offset+=S.limit;loadLeads()">下一页</button>`:`<span class="muted" style="font-size:12px">共 ${r.total} 条</span>`;
}

async function openLead(id){
  S.lead=id;S.editing=false;const l=await api('/api/lead/'+id),p=(l.data||{}).prospect||{},plan=(l.data||{}).plan||{};
  $('#dtitle').innerHTML=`${E(l.company||l.domain)} <span class="st ${l.status}">${ST[l.status]||l.status}</span>`;
  const canSend=['ready','failed'].includes(l.status)&&l.subject,locked=['sent','unknown','replied','imaging','writing','researching'].includes(l.status);
  const facts=[['账号',l.account],['邮箱',`${E(l.email)} <span class="muted">${p.email_source&&p.email_source.startsWith('http')?`· <a href="${E(p.email_source)}" target="_blank">来源页</a>`:''}</span>`],
    ['官网',p.website?`<a href="${E(p.website)}" target="_blank">${E(p.website)}</a>`:''],['国家',p.country],['产品',p.product_url?`<a href="${E(p.product_url)}" target="_blank">${E(p.product_name)}</a>`:E(p.product_name)],
    ['产品信息',E([p.product_price,...(p.product_facts||[])].filter(Boolean).join(' · '))],['A 方案',E((plan.a||{}).name)],['B 方案',E((plan.b||{}).name)],

  $('#dbody').innerHTML=`${l.reply_excerpt?`<div class="reply"><b>客户回复：</b>\n${E(l.reply_excerpt)}</div>`:''}
    <div class="row" style="margin-bottom:12px">${canSend?`<button class="primary" onclick="leadAct('send',${id})">✉ 立即发送</button>`:''}
    ${!locked&&l.subject?`<button onclick="editLead(${id})">✎ 修改文字</button>`:''}${!locked&&plan.a?`<button onclick="leadAct('redo',${id},'image')">↻ 重做图片</button>`:''}
    ${!locked?`<button onclick="leadAct('redo',${id},'all')">↻ 重写邮件+图片</button>`:''}${!['sent','unknown','replied','skipped'].includes(l.status)?`<button class="danger" onclick="leadAct('skip',${id})">跳过</button>`:''}</div>

     ${k==='write'?`<label class="hint">推理强度<select data-s="write" data-k="effort">${['','minimal','low','medium','high'].map(v=>opt(v,v||'默认',S2.write.effort||'')).join('')}</select></label><label class="chk"><input type="checkbox" data-s="write" data-k="vision" ${S2.write.vision!==false?'checked':''}> 看产品图</label>`:''}

function addConn(){collect();const n=prompt('连接名称（英文，例如 deepseek 或 relay2）');if(!n)return;const id=n.replace(/[^\w-]/g,'').toLowerCase();if(!id||S.settings.connections[id])return toast('名称无效或已存在');S.settings.connections[id]={preset:'relay',kind:'openai',base_url:''};S.settings.has_key[id]=false;renderSettings()}

   <p class="hint">代码在 GitHub：<a href="https://github.com/Alexanderhe1212/packaging-outreach" target="_blank">Alexanderhe1212/packaging-outreach</a>。更新只替换程序文件，账号、密钥、客户记录都在数据目录，不受影响。</p></fieldset>
   <fieldset><legend>导入不联系名单（CSV）</legend><p class="hint">表头包含 email 或 website 列即可，例如从其他系统导出的已联系客户。</p><textarea id="csv" rows="5" placeholder="email,website&#10;hello@brand.com,brand.com"></textarea><div class="row" style="margin-top:8px"><button class="small" onclick="importCsv()">导入</button></div></fieldset>
   <fieldset><legend>数据</legend><p class="hint">数据目录：<code>${E(st.data_dir||'')}</code><br>旧版名单导入：${st.legacy?`已导入 ${st.legacy.contacted} 个已联系、${st.legacy.stops} 个回复/退订/退信记录`:'未配置'}</p></fieldset>`;
}
async function checkUpd(){const u=$('#upd');u.textContent='检查中…';const r=await api('/api/update/check');if(r.error){u.textContent=r.error;return}
  u.innerHTML=r.update?`发现新版本 v${E(r.latest)} <button class="small primary" onclick="applyUpd()">立即更新并重启</button>`:`已是最新（GitHub v${E(r.latest)}）`}
async function applyUpd(){$('#upd').textContent='更新中…';try{await api('/api/update/apply',{});toast('更新完成，正在重启…',5000);setTimeout(()=>location.reload(),4000)}catch(e){$('#upd').textContent=e.message}}
async function importCsv(){try{const r=await api('/api/import-csv',{csv:$('#csv').value});toast('已导入 '+r.imported+' 条')}catch(e){toast(e.message)}}

function setPath(o,path,v){const ks=path.split('.');let t=o;ks.slice(0,-1).forEach(k=>{t[k]=t[k]||{};t=t[k]});t[ks.at(-1)]=v}
function collect(){
  const st=S.settings;if(!st)return;
  document.querySelectorAll('[data-c]').forEach(el=>{st.connections[el.dataset.c][el.dataset.k]=el.value.trim()});
  document.querySelectorAll('[data-key]').forEach(el=>{if(el.value)S.keys[el.dataset.key]=el.value.trim()});
  document.querySelectorAll('[data-s]').forEach(el=>{const s=st.stages[el.dataset.s];let v=el.type==='checkbox'?el.checked:el.type==='number'?+el.value:el.value.trim();s[el.dataset.k]=v});
  document.querySelectorAll('[data-pw]').forEach(el=>{if(el.value)S.pw[el.dataset.pw]=el.value});
  document.querySelectorAll('[data-a]').forEach(el=>{const a=st.accounts[+el.dataset.a],k=el.dataset.k,v=el.value;
    if(k==='interval0'||k==='interval1'){a.send_interval_minutes=a.send_interval_minutes||[4,9];a.send_interval_minutes[+k.slice(-1)]=+v||0}
    else if(k==='hours0'||k==='hours1'){a._h=a._h||[...(a.send_hours_beijing||['',''])];a._h[+k.slice(-1)]=v}
    else if(k==='focus')a.focus=v.split('\n').map(s=>s.trim()).filter(Boolean);
    else if(['auto_send','followup_enabled'].includes(k))a[k]=v==='true';
    else if(['daily_limit','followup_days','smtp.port','imap.port'].includes(k))setPath(a,k,+v||0);
    else setPath(a,k,v.trim())});
  if($('#totalLimit'))st.daily_limit_total=+$('#totalLimit').value||0;
  if($('#crossLock'))st.cross_account_dedupe=$('#crossLock').checked;
  st.accounts.forEach(a=>{if(a._h){a.send_hours_beijing=(a._h[0]!==''&&a._h[1]!=='')?[+a._h[0],+a._h[1]]:null;delete a._h}});
  if(S.stab==='prof')collectProf();
}
async function persist(){
  const st=S.settings;
  const r=await api('/api/settings',{connections:st.connections,stages:st.stages,accounts:st.accounts,daily_limit_total:st.daily_limit_total||0,cross_account_dedupe:!!st.cross_account_dedupe,keys:S.keys,passwords:S.pw});
  for(const id of (S.pdirty||[]))await api('/api/profile',{profile:st.profiles[id]});S.pdirty=new Set();
  const profiles=st.profiles;S.settings=r;S.settings.profiles=profiles;S.keys={};S.pw={};
}
async function saveSettings(){collect();try{await persist();toast('已保存');renderSettings();refresh()}catch(e){toast(e.message,5000)}}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeModal('addModal');closeModal('setModal')}});
async function tick(){await refresh();if(!S.editing)loadLeads();loadUsage()}
tick();setInterval(refresh,3000);setInterval(()=>{if(!S.editing&&!$('#setModal').classList.contains('open'))loadLeads();loadUsage()},8000);
</script>
