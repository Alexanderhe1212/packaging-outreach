<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submit Leads · User Radar</title>
<style>
:root{--ink:#18332f;--muted:#60746c;--green:#147567;--line:#dce5df;--bg:#f5f7f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1120px;margin:auto;padding:26px 28px 40px}h1{font-size:25px;letter-spacing:-.6px;margin:0 0 6px}p{margin:0}button,input,select{font:inherit}button,select,input[type=search]{border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-height:38px;padding:8px 12px}button{cursor:pointer;white-space:nowrap}button:hover{border-color:#9cb6a8}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #72b9a7;outline-offset:3px}.muted{color:var(--muted)}.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.page-head p{font-size:13px;max-width:600px}.summary{display:flex;gap:8px;margin-top:12px}.metric{font-size:12px;color:var(--muted);padding:4px 9px;background:#e9f0eb;border-radius:6px}.metric strong{color:var(--ink);margin-left:5px}.panel{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}.tools{padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}.tabs{display:flex;gap:4px}.tabs button{border:0;background:transparent;min-height:36px;padding:7px 10px;color:var(--muted)}.tabs button[aria-pressed=true]{background:#e8f2ec;color:#116254;font-weight:600}input[type=search]{width:240px;max-width:100%;background:#fafcf9}.selectionbar{display:flex;gap:12px;align-items:center;padding:10px 16px;background:#fcfdfb;font-size:12px}.linkbutton{border:0;min-height:30px;padding:4px 2px;background:transparent;color:var(--green);font-size:12px}.selectionbar #selection{margin-left:auto;color:var(--muted)}table{width:100%;border-collapse:collapse;table-layout:fixed}th{text-align:left;font-size:11px;font-weight:600;color:var(--muted);padding:10px 12px;background:#fafbf8;white-space:nowrap}td{padding:13px 12px;border-top:1px solid #edf1ec;vertical-align:middle;overflow-wrap:anywhere;font-size:13px}th:first-child,td:first-child{width:44px;text-align:center;padding-left:16px;padding-right:6px}th:nth-child(2){width:34%}th:last-child{width:110px}input[type=checkbox]{width:17px;height:17px;accent-color:var(--green);cursor:pointer}tr.selected{background:#f0f7f2}.company{font-weight:600;line-height:1.4}.contact-name{font-size:12px;color:var(--muted);margin-top:3px}.badge{display:inline-block;font-size:11px;line-height:1.3;padding:4px 7px;border-radius:5px;background:#eff3ef;color:#54685e}.badge.person{background:#e7f3eb;color:#25664b}.badge.imported{color:#78877d}.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.pager button{min-height:32px;padding:5px 10px}.empty{text-align:center;padding:38px 18px}.empty strong{display:block;font-size:16px;margin-bottom:6px}.empty p{font-size:13px;color:var(--muted);max-width:430px;margin:auto}.submitbar{position:sticky;bottom:0;z-index:2;margin-top:16px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 -4px 18px #18332f06;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.submitbar label{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}.primary{background:var(--green);border-color:var(--green);color:#fff;padding:10px 20px;font-weight:600}.submitbar small{display:block;max-width:430px;color:var(--muted);font-size:11px;margin-top:7px}.advanced{margin-top:20px;font-size:13px;color:var(--muted)}summary{cursor:pointer;padding:8px 0;font-weight:600}.advanced section{padding:16px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:10px}.advanced p{font-size:12px;margin:8px 0}.advanced h2{font-size:14px;margin:0 0 8px;color:var(--ink)}.advanced button{font-size:12px}.advanced table{margin-top:12px}#notice:empty{display:none}#notice{white-space:pre-wrap;border-radius:8px;background:#edf5ef;color:#245640;padding:12px 14px;margin-bottom:16px;font-size:13px}#notice[data-error=true]{background:#fff1eb;color:#963e22}a{color:var(--green)}.legend{margin:12px 2px 0;font-size:11px;color:var(--muted)}@media(max-width:650px){main{padding:18px 14px}.page-head{align-items:flex-start}h1{font-size:22px}.tools{gap:8px}input[type=search]{width:100%}.tools>input{flex:1;min-width:150px}th:last-child,td:last-child{display:none}th:nth-child(2){width:39%}.selectionbar{flex-wrap:wrap}.submitbar{position:static}.submitbar>div{width:100%}.submitbar .primary{width:100%}.summary{flex-wrap:wrap}}
</style><main>
<div class="page-head"><div><h1>提交客户</h1><p class="muted">选择客户交给开发流程，后续写信、效果图和发送自动衔接。</p><div class="summary"><span class="metric">待提交<strong id="new-count">—</strong></span><span class="metric">已提交<strong id="imported-count">—</strong></span></div></div><button id="refresh">刷新</button></div>
<div id="notice" role="status" aria-live="polite"></div>
<div class="panel"><div class="tools"><div class="tabs" role="group" aria-label="客户范围"><button id="tab-new" aria-pressed="true">待提交客户</button><button id="tab-all" aria-pressed="false">全部已保存</button></div><input type="search" id="search" placeholder="搜索客户…" aria-label="搜索公司、姓名或邮箱"></div>
<div class="selectionbar"><button class="linkbutton" id="select-all">选择筛选结果</button><button class="linkbutton" id="select-none">清空选择</button><span id="selection" aria-live="polite"></span></div><div id="contacts" aria-live="polite"><div class="empty">正在读取…</div></div><div class="pager"><span id="page-info"></span><div><button id="prev">上一页</button><button id="next">下一页</button></div></div></div>
<p class="legend">每家公司优先选择一位联系人；已提交的公司不会重复提交。</p>
<div class="submitbar"><label for="account">开发账号<select id="account"><option value="">请选择账号</option></select></label><div><button class="primary" id="one-step" disabled>提交并开始开发</button><small>提交后按现有规则自动开发，符合条件的邮件可能自动发送。</small></div></div>
<details class="advanced"><summary>高级选项与提交记录</summary><section><h2>仅保存到待开发</h2><p>只导入所选客户，不启动账号。</p><button id="import">仅导入</button></section><section><h2>已导入 OutreachPilot</h2><button id="release">开始开发该账号的待开发客户</button><div id="imported"></div></section><section><h2>后续客户来源</h2><p id="setting"></p><p id="auto-status" role="status"></p><button id="enable">启用雷达作为该账号的客户来源</button><button id="disable">恢复原客户来源</button><p><a href="http://127.0.0.1:18830/" target="_blank" rel="noopener">打开用户雷达</a></p></section></details>
</main><script>
'use strict';const $=id=>document.getElementById(id),cell=(tag,text)=>{const e=document.createElement(tag);e.textContent=text||'';return e};
let snapshot={contacts:[],imported:[],accounts:[],automatic:{}},selected=new Set(),mode='new',page=0,busy=false,loaded=false;const pageSize=20;
const t=(zh,en)=>document.documentElement.lang==='en'?en:zh;
const domain=p=>new URL(p.website).hostname.replace(/^www\./,'');
const importedDomains=()=>new Set(snapshot.imported.map(p=>p.domain.replace(/^www\./,'')));
function eligible(p){return !importedDomains().has(domain(p))}
function rows(){const q=$('search').value.trim().toLowerCase();return [...snapshot.contacts].sort((a,b)=>Number(!!b.name)-Number(!!a.name)).filter(p=>(mode==='all'||eligible(p))&&[p.company,p.name,p.email].join(' ').toLowerCase().includes(q))}
function notice(text,error=false){$('notice').textContent=text;$('notice').dataset.error=String(error)}
async function api(path,data){const r=await fetch(path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Outreach-Source':'ui'},body:JSON.stringify(data)});const v=await r.json();if(!r.ok||v.error)throw Error(v.error||t('连接失败','Connection failed'));return v}
function account(){if(!$('account').value)throw Error(t('请先选择 GUKA 或 MTT 账号','Select GUKA or MTT first'));return $('account').value}
function selection(){const chosen=snapshot.contacts.filter(p=>selected.has(p.id)&&eligible(p));$('selection').textContent='已选 '+chosen.length+' 条 / '+new Set(chosen.map(domain)).size+' 家公司';$('one-step').disabled=busy||!chosen.length||!$('account').value;$('import').disabled=busy||!chosen.length||!$('account').value;$('select-none').disabled=busy||!selected.size;return chosen}
function render(){const focusId=document.activeElement?.matches('#contacts input')?document.activeElement.value:null;const all=rows();page=Math.min(page,Math.max(0,Math.ceil(all.length/pageSize)-1));$('tab-new').setAttribute('aria-pressed',String(mode==='new'));$('tab-all').setAttribute('aria-pressed',String(mode==='all'));$('contacts').replaceChildren();
 if(!all.length){const empty=cell('div','');empty.className='empty';empty.append(cell('strong',$('search').value?t('没有匹配的客户','No matching customers'):t('暂无待提交客户','No leads waiting to submit')),cell('p',$('search').value?t('试试其他公司名、姓名或邮箱。','Try another company, name or email.'):t('自动流程会持续保存并领取客户。已提交记录可在“全部已保存”查看。','The automatic workflow keeps saving and collecting leads. View submitted records under All Saved.')));$('contacts').append(empty)}else{
 const table=document.createElement('table'),head=document.createElement('thead'),tr=document.createElement('tr');for(const label of ['','公司 / 联系人','邮箱','类型'])tr.append(cell('th',label));head.append(tr);table.append(head);const body=document.createElement('tbody');for(const p of all.slice(page*pageSize,(page+1)*pageSize)){const tr=document.createElement('tr'),td=cell('td',''),input=document.createElement('input');input.type='checkbox';input.value=p.id;input.disabled=busy||!eligible(p);input.checked=selected.has(p.id)&&eligible(p);input.setAttribute('aria-label',(p.company||domain(p))+' '+p.email);input.onchange=()=>{if(input.checked){for(const other of snapshot.contacts)if(domain(other)===domain(p))selected.delete(other.id);if(selected.size>=100){input.checked=false;notice(t('每次最多提交100家公司','Submit up to 100 companies at a time'),true);return}selected.add(p.id)}else selected.delete(p.id);render()};td.append(input);const company=cell('td',''),name=cell('div',p.company||domain(p));name.className='company';const person=cell('div',p.name||domain(p));person.className='contact-name';company.append(name,person);const type=cell('td',''),badge=cell('span',eligible(p)?(p.name?'个人联系人':'公共邮箱'):'已提交');badge.className='badge '+(!eligible(p)?'imported':p.name?'person':'');type.append(badge);tr.classList.toggle('selected',input.checked);tr.append(td,company,cell('td',p.email),type);body.append(tr)}table.append(body);$('contacts').append(table)}
 $('new-count').textContent=new Set(snapshot.contacts.filter(eligible).map(domain)).size;$('imported-count').textContent=importedDomains().size;$('page-info').textContent=all.length?(page*pageSize+1)+'–'+Math.min((page+1)*pageSize,all.length)+' / '+all.length:'0';$('prev').disabled=busy||page===0;$('next').disabled=busy||(page+1)*pageSize>=all.length;$('select-all').disabled=busy||!all.some(eligible);selection();if(focusId){const input=[...$('contacts').querySelectorAll('input')].find(e=>e.value===focusId);if(input&&!input.disabled)input.focus({preventScroll:true})}}
async function load(){const data=await api('/api/radar');snapshot=data;const previous=$('account').value;$('account').replaceChildren(cell('option','请选择账号'));$('account').firstChild.value='';for(const a of data.accounts){const o=cell('option',a.id);o.value=a.id;$('account').append(o)}$('account').value=previous||data.automatic.account||'';selected=new Set([...selected].filter(id=>data.contacts.some(p=>p.id===id&&eligible(p))));if(!loaded){const domains=new Set();for(const p of rows()){if(eligible(p)&&!domains.has(domain(p))&&selected.size<100){selected.add(p.id);domains.add(domain(p))}}loaded=true}render();
 const list=document.createElement('table');for(const p of data.imported){const tr=document.createElement('tr');tr.append(cell('td',p.account),cell('td',p.domain),cell('td',p.status));list.append(tr)}$('imported').replaceChildren(list);$('setting').textContent=data.automatic.enabled?'已启用：'+(data.automatic.mode==='shared_random'?'GUKA / MTT 共享随机分配':data.automatic.account):t('尚未启用自动领取','Automatic intake is off');$('auto-status').textContent=(data.discovery||{}).stage||'';}
function bind(id,fn){$(id).onclick=async()=>{if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);$('account').disabled=true;try{await fn()}catch(e){notice(e.message,true)}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);$('account').disabled=false;render()}}}
$('account').onchange=selection;$('search').oninput=()=>{page=0;render()};for(const [id,value] of [['tab-new','new'],['tab-all','all']])$(id).onclick=()=>{mode=value;page=0;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};
bind('select-all',()=>{const seen=new Set(snapshot.contacts.filter(p=>selected.has(p.id)).map(domain));for(const p of rows())if(eligible(p)&&!seen.has(domain(p))&&selected.size<100){selected.add(p.id);seen.add(domain(p))}render()});bind('select-none',()=>{selected.clear();render()});bind('refresh',load);
bind('one-step',async()=>{const aid=account(),chosen=selection();if(!chosen.length)throw Error(t('请先选择客户','Select customers first'));const contact_ids=chosen.map(p=>p.id),domains=new Set(chosen.map(domain));let stage=t('导入客户','Importing leads');try{notice(t('正在提交客户…','Submitting leads…'));await api('/api/radar/import',{account:aid,contact_ids});const latest=await api('/api/radar');const ids=latest.imported.filter(p=>p.account===aid&&p.status==='radar_review'&&domains.has(p.domain.replace(/^www\./,''))).map(p=>p.id);stage=t('启用后续客户来源','Configuring intake');await api('/api/radar/configure',{account:aid,enabled:true});stage=t('加入开发队列','Queueing leads');const released=ids.length?await api('/api/radar/release',{account:aid,ids}):{ids:[]};stage=t('启动账号','Starting account');await api('/api/start',{account:aid});await load();notice(t('已加入开发队列：','Added to outreach queue: ')+released.ids.length+t(' 家。实际发送结果请查看发送页面。',' companies. Check Send for actual sending results.'))}catch(e){throw Error(stage+': '+e.message+t('。已完成的步骤会保留，请刷新查看。',' Completed steps are retained. Refresh to check.'))}});
bind('import',async()=>{const v=await api('/api/radar/import',{account:account(),contact_ids:selection().map(p=>p.id)});await load();notice(t('已导入但未启动：','Imported without starting: ')+v.ids.length)});
bind('release',async()=>{const aid=account(),ids=snapshot.imported.filter(p=>p.account===aid&&p.status==='radar_review').map(p=>p.id);if(!ids.length)throw Error(t('该账号没有待开发客户','No held leads for this account'));const v=await api('/api/radar/release',{account:aid,ids});if(v.ids.length)await api('/api/start',{account:aid});await load();notice(t('已加入队列：','Queued: ')+v.ids.length)});
bind('enable',async()=>{await api('/api/radar/configure',{account:account(),enabled:true});await load()});bind('disable',async()=>{await api('/api/radar/configure',{account:account(),enabled:false});await load()});load().catch(e=>notice(e.message,true));
</script></html>
