<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>展会获客审核</title><style>
:root{font:15px/1.6 -apple-system,BlinkMacSystemFont,sans-serif;color:#18332f;background:#f5f7f4}body{max-width:1100px;margin:32px auto;padding:0 24px}header,.actions{display:flex;gap:12px;align-items:center;justify-content:space-between}h1{font-size:26px;margin:0}p{color:#60716b}button,select,textarea{font:inherit;padding:8px;border:1px solid #becdc6;border-radius:6px;background:white}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #147567}button.primary{background:#147567;color:white}button:disabled{opacity:.5}article,.summary{background:white;border:1px solid #dce5df;border-radius:12px;padding:22px;margin:18px 0}h2{margin:0;font-size:20px}.meta{color:#60716b;font-size:13px}.evidence{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;background:#f5f7f4}label{display:block;margin:10px 0}textarea{display:block;box-sizing:border-box;width:100%;min-height:64px}a{color:#146658;overflow-wrap:anywhere}#error{color:#a13621}.badge{padding:4px 9px;background:#edf5ee;border-radius:6px}.actions{justify-content:flex-start;flex-wrap:wrap}time{display:block}#notice{min-height:25px}summary{cursor:pointer}
</style><header><h1 id="heading"></h1><div><select id="language" aria-label="Language"><option value="zh">中文</option><option value="en">English</option></select> <button id="refresh"></button></div></header><p id="intro"></p><div id="error" role="alert"></div><div id="notice" role="status" aria-live="polite"></div><div id="summary" class="summary"></div><div id="rows"></div>
<script>
let lang=new URLSearchParams(location.search).get('lang')||'zh',data=null;let busy=false;
const words={zh:{heading:'展会获客审核',refresh:'刷新',intro:'固定寻找包装经销商和包装用品店。审核通过后可用于下一层扩展；此处审核不会发送邮件。',pending:'待审核',approved:'审核通过',rejected:'已退回',researching:'正在查询',awaiting_review:'等待审核',review_capacity_wait:'审核队列已满',daily_budget_wait:'今日查询预算已用完',account_pause_wait:'账号已暂停或服务不可用',paused:'已暂停',job_review_required:'查询结果需要复核',submission_review_required:'提交结果未知，需复核',status:'运行状态',budget:'今日研究调用',rows:'候选公司',next:'下次处理',next30:'约 30 秒后检查；达到预算或审核容量时等待',nextday:'次日北京时间 00:00 后继续检查',depth:'扩展层数',parent:'上级来源',seed:'初始种子',proof:'查看官网与展会证据',email:'公开邮箱线索（需独立核实）',source:'选择已核实的展会来源',grade:'审核等级',industry:'已核实为包装经销商或包装用品店',compliance:'已核查来源、商务渠道和联系限制',note:'审核理由（必填）',approve:'通过审核，允许后续扩展',reject:'退回待处理',handoff:'软件交接与发送记录',none:'尚未交接；没有发送回执',open:'打开软件记录',saved:'审核已保存；没有触发发送',failed:'操作未完成',changed:'资料已变化，请刷新重新审核',unknown:'待核实',ready:'待发送',sent:'SMTP 已接受',queued:'等待处理',writing:'正在写信',failedLead:'需处理',blocked:'发送受保护拦截'},en:{heading:'Exhibitor Review',refresh:'Refresh',intro:'Packaging distributors and supplies shops only. Approval enables further expansion; reviewing here does not send email.',pending:'Awaiting review',approved:'Approved',rejected:'Returned',researching:'Researching',awaiting_review:'Awaiting review',review_capacity_wait:'Review capacity reached',daily_budget_wait:'Daily research budget reached',account_pause_wait:'Accounts paused or service unavailable',paused:'Paused',job_review_required:'Research needs review',submission_review_required:'Submission outcome unknown',status:'Worker status',budget:'Research calls today',rows:'Candidate companies',next:'Next check',next30:'Checks in about 30 seconds; waits at budget or review capacity',nextday:'Checks resume after 00:00 Beijing time tomorrow',depth:'Expansion depth',parent:'Parent source',seed:'Initial seed',proof:'Website and exhibitor evidence',email:'Public email clue (independent verification required)',source:'Select verified exhibitor source',grade:'Review grade',industry:'Verified packaging distributor or supplies shop',compliance:'Checked sources, business channel and contact restrictions',note:'Review reason (required)',approve:'Approve for further expansion',reject:'Return for review',handoff:'Software handoff and send records',none:'No handoff or SMTP receipt',open:'Open software record',saved:'Review saved; no email was sent',failed:'Action incomplete',changed:'Evidence changed; refresh and review again',unknown:'Unverified',ready:'Ready to send',sent:'SMTP accepted',queued:'Queued',writing:'Writing',failedLead:'Needs attention',blocked:'Protected'}};
const t=k=>words[lang][k]||k,el=(tag,text,parent)=>{let n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(parent)parent.append(n);return n};
function link(url,parent){try{const u=new URL(url);if(!['http:','https:'].includes(u.protocol))return;let a=el('a',url,parent);a.href=u.href;a.target='_blank';a.rel='noopener noreferrer'}catch{}}
function render(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelector('#language').value=lang;for(const k of ['heading','refresh','intro'])document.querySelector('#'+k).textContent=t(k);if(!data)return;let box=document.querySelector('#summary');box.replaceChildren();el('strong',t('status')+' · '+t(data.status),box);el('p',t('budget')+': '+data.calls_today+' / '+data.config.daily_search_calls+' · '+t('rows')+': '+data.rows.length,box);el('p',t('next')+': '+t(data.status==='daily_budget_wait'?'nextday':'next30'),box);if(data.error)el('p',data.error,box);let list=document.querySelector('#rows');list.replaceChildren();for(const row of data.rows){let a=el('article',undefined,list);el('h2',row.company,a);el('span',t(row.review),a).className='badge';link(row.website,a);el('p',t('depth')+': '+row.depth+' · '+t('parent')+': '+(row.parent||t('seed')),a).className='meta';let candidate=row.evidence?.candidate||{};el('p',t('email')+': '+(candidate.email||t('unknown')),a);let details=el('details',undefined,a);el('summary',t('proof'),details);el('p',candidate.fit_reason||'',details).className='evidence';for(const src of candidate.sources||[]){link(src.url,details);el('p',src.quote||'',details).className='evidence'}el('h3',t('handoff'),a);if(!row.handoffs?.length)el('p',t('none'),a);for(const h of row.handoffs||[]){el('p',h.account+' · #'+h.id+' · '+t(h.status==='failed'?'failedLead':h.status)+(h.error?' · '+h.error:''),a);let l=el('a',t('open'),a);l.href='http://127.0.0.1:18800/?search='+encodeURIComponent(row.company);l.target='_blank';l.rel='noopener noreferrer'}
let form=el('form',undefined,a);let label=el('label',t('source'),form),source=el('select',undefined,label);source.required=false;source.setAttribute('aria-label',t('source'));el('option','',source).value='';for(const s of candidate.sources||[]){let o=el('option',s.url,source);o.value=s.url}source.value=row.exhibitor_source||'';label=el('label',t('grade'),form);let grade=el('select',undefined,label);for(const value of ['B','A'])el('option',value,grade).value=value;grade.value=row.grade||'B';let checks=[];for(const k of ['industry','compliance']){label=el('label',undefined,form);let c=el('input',undefined,label);c.type='checkbox';label.append(document.createTextNode(' '+t(k)));checks.push(c)}label=el('label',t('note'),form);let note=el('textarea',row.review_note||'',label);note.required=true;let actions=el('div',undefined,form);actions.className='actions';for(const decision of ['approved','rejected']){let b=el('button',t(decision==='approved'?'approve':'reject'),actions);b.type='button';if(decision==='approved')b.className='primary';b.onclick=async()=>{if(busy||!form.reportValidity())return;if(decision==='approved'&&(!checks[0].checked||!checks[1].checked)){document.querySelector('#error').textContent=t('industry')+' / '+t('compliance');return}busy=true;form.querySelectorAll('button').forEach(x=>x.disabled=true);try{let r=await fetch('/api/expansion/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({website:row.website,revision:row.revision,decision,grade:grade.value,exhibitor_source:source.value,industry_verified:checks[0].checked,compliance_checked:checks[1].checked,note:note.value})});let result=await r.json();if(!r.ok)throw Error(result.error||t('failed'));document.querySelector('#notice').textContent=t('saved');await load()}catch(e){document.querySelector('#error').textContent=e.message}finally{busy=false;form.querySelectorAll('button').forEach(x=>x.disabled=false)}}}}}
async function load(){try{let r=await fetch('/api/expansion');let s=await r.json();if(!r.ok)throw Error(s.error||t('failed'));data=s;document.querySelector('#error').textContent='';render()}catch(e){document.querySelector('#error').textContent=e.message}}
window.ExhibitorReview={setLanguage(value){lang=value==='en'?'en':'zh';render()}};
document.querySelector('#language').onchange=e=>{lang=e.target.value;render()};document.querySelector('#refresh').onclick=load;render();load();
</script></html>
