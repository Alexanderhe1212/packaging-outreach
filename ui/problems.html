<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>问题与修复</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f8f6;color:#18332f;font:14px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}main{max-width:1000px;margin:auto;padding:28px}h1{font-size:24px;margin:0}p{color:#687b74}button{font:inherit;border:1px solid #d7e1dc;border-radius:8px;padding:8px 14px;background:white;color:#18332f;cursor:pointer}button.active,button.retry{background:#167567;color:white;border-color:#167567}button:disabled{opacity:.5;cursor:wait}.bar{display:flex;gap:10px;margin:22px 0}.card{background:white;border:1px solid #e0e8e2;border-radius:12px;padding:18px;margin-bottom:12px}.row{display:flex;gap:14px;align-items:center;justify-content:space-between}.who{overflow-wrap:anywhere;font-weight:650}.meta{color:#728079;font-size:12px}.reason{margin:12px 0;color:#9e422f;overflow-wrap:anywhere}.tag{white-space:nowrap;font-size:12px;background:#fbece5;color:#9e422f;border-radius:20px;padding:4px 10px}.resolved{background:#e5f3ed;color:#167567}.pending{background:#edf0fc;color:#5261a5}a{color:#167567}#notice{color:#9e422f}button:focus-visible,a:focus-visible{outline:3px solid #60b8a1;outline-offset:3px}</style>
<main><h1>问题与修复</h1><p>问题保留到处理完成。重新核验不等于已解决；SMTP 接受后会移入解决记录，仍不代表邮件已送达。</p><div class="bar"><button id="open" class="active">待处理</button><button id="resolved">解决记录</button><button id="refresh">刷新</button></div><p id="notice" role="status"></p><details class="card"><summary>记录其他问题</summary><form id="newProblem"><p><label>问题标题<br><input id="problemTitle" maxlength="150" required style="width:100%;padding:10px;font:inherit"></label></p><p><label>出现的情况<br><textarea id="problemDetail" maxlength="3000" rows="3" style="width:100%;font:inherit"></textarea></label></p><button type="submit">保存问题</button></form></details><section id="list" aria-live="polite">正在读取…</section></main>
<script>
let mode='open',busy=false;const $=id=>document.getElementById(id),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,data){const r=await fetch(path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});const j=await r.json();if(!r.ok||j.error)throw Error(j.error||'读取失败');return j}
function date(t){return new Date(t*1000).toLocaleString('zh-CN')}
async function load(){try{const r=await api('/api/problems');$('open').textContent='待处理 '+r.open;$('resolved').textContent='解决记录 '+r.resolved;const rows=r.items.filter(x=>(x.state==='resolved')===(mode==='resolved'));$('list').innerHTML=rows.map(x=>`<article class="card"><div class="row"><div class="who">${E(x.company||'未命名客户')}</div><span class="tag ${x.state==='resolved'?'resolved':x.state==='retrying'?'pending':''}">${x.state==='resolved'?'已恢复':x.state==='retrying'?'正在重试':'待处理'}</span></div><div class="meta">${E(x.account)} · ${E(x.email)} · 记录 #${x.id}</div><div class="reason">${E(x.reason||'发送结果需要核实')}</div>${x.resolution?`<p>解决办法：${E(x.resolution)}</p>`:''}<div class="row"><span class="meta">首次记录 ${date(x.first_seen)}${x.resolved_at?' · 恢复 '+date(x.resolved_at):''}</span>${x.status==='manual'&&x.state!=='resolved'?`<button data-resolve="${E(x.id)}">标记已解决</button>`:x.status==='failed'?`<button class="retry" data-id="${x.id}" ${busy?'disabled':''}>重新核验并重试</button>`:x.status==='unknown'?'<span class="meta">先核对发件箱，避免重复发送</span>':''}</div><details><summary>处理说明</summary><p>重新读取官网并校验邮箱、重新生成内容；账号运行且开启自动发送时，通过保护检查后发送。原错误保留。退订、退信、已回复、发送结果未知或历史已发记录不能强制重发。</p></details></article>`).join('')||'<div class="card">这里暂时没有记录。</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>retry(Number(b.dataset.id)));document.querySelectorAll('[data-resolve]').forEach(b=>b.onclick=async()=>{const resolution=prompt('记录解决办法');if(!resolution)return;try{await api('/api/problems/resolve',{id:b.dataset.resolve,resolution});load()}catch(e){$('notice').textContent=e.message}})}catch(e){$('notice').textContent=e.message}}
async function retry(id){if(busy)return;busy=true;document.querySelectorAll('[data-id]').forEach(b=>b.disabled=true);try{await api('/api/redo',{id,what:'research'});$('notice').textContent='已进入重新核验队列；通过后按账号设置继续发送。'}catch(e){$('notice').textContent=e.message}finally{busy=false;load()}}
$('newProblem').onsubmit=async e=>{e.preventDefault();try{await api('/api/problems/add',{title:$('problemTitle').value,detail:$('problemDetail').value});$('newProblem').reset();load()}catch(err){$('notice').textContent=err.message}};
for(const key of ['open','resolved'])$(key).onclick=()=>{mode=key;for(const k of ['open','resolved'])$(k).classList.toggle('active',k===key);load()};$('refresh').onclick=load;load();setInterval(()=>{if(!busy)load()},10000);
</script></html>
