<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>问题与修复 · User Radar</title><link rel="stylesheet" href="/workspace.css"><style>*{box-sizing:border-box}body{margin:0}main{margin:auto}button{padding:7px 12px;border:1px solid var(--line);background:#fff;cursor:pointer}.tag{background:#f4eee5;color:#846239;padding:4px 9px}.tag.resolved{background:var(--soft);color:var(--accent)}.tag.pending{background:#eaf0f5;color:#4d6d89}.meta{font-size:12px}.report-form{margin-top:24px;padding:16px 20px}.report-form summary{font-size:12px;cursor:pointer}.report-form input,.report-form textarea{width:100%;margin-top:6px}.report-form label{font-size:12px}#notice:empty{display:none}#notice{padding:12px 16px;background:var(--soft);border-radius:9px;color:var(--ink);font-size:13px}</style></head><body><main>
<div class="issue-head"><div><div class="eyebrow">WORKSPACE HEALTH / 运行健康</div><h1>问题与修复</h1><p class="muted">先处理阻塞，再补全资料。等待、保护与历史记录分别查看。</p></div><button id="refresh">刷新状态</button></div>
<div class="issue-metrics"><div class="issue-metric urgent"><small>需要处理 · Action needed</small><strong id="metric-attention">—</strong></div><div class="issue-metric"><small>资料待复核 · Review</small><strong id="metric-review">—</strong></div><div class="issue-metric"><small>安排中 · Scheduled</small><strong id="metric-waiting">—</strong></div></div>
<div class="issue-tabs" role="group" aria-label="问题范围"><button id="open" class="active" aria-pressed="true">需要处理</button><button id="review">资料待复核</button><button id="automatic">自动等待</button><button id="protected">发送保护</button><button id="resolved">已解决</button><button id="all">全部记录</button></div>
<div class="issue-tools"><input id="search" type="search" aria-label="搜索问题" placeholder="搜索公司、邮箱或问题…"><select id="group" aria-label="问题类型"><option value="">所有问题类型</option></select></div>
<p id="scope" class="meta"></p><p id="notice" role="status" aria-live="polite"></p><section id="list" aria-live="polite">正在读取…</section>
<div class="issue-pager"><span id="page-info"></span><div><button id="prev">上一页</button><button id="next">下一页</button></div></div>
<details class="card report-form"><summary>记录其他问题</summary><form id="newProblem"><p><label>问题标题<input id="problemTitle" maxlength="150" required></label></p><p><label>出现的情况<textarea id="problemDetail" maxlength="3000" rows="3"></textarea></label></p><button type="submit">保存问题</button></form></details>
<p class="meta">记录保留原始原因与处理历史；分类变化不代表问题已解决。暂停期间不会自动启动查询或发送。</p>
</main><script>
'use strict';let mode='open',busy=false,page=0,snapshot={items:[],counts:{}},loading=false;const size=20,keys=['open','review','automatic','protected','resolved','all'];const $=id=>document.getElementById(id),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,data){const r=await fetch(path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});const j=await r.json();if(!r.ok||j.error)throw Error(j.error||'读取失败');return j}
const date=t=>t?new Date(t*1000).toLocaleString(document.documentElement.lang==='en'?'en-GB':'zh-CN'):'—';
function inMode(x){return mode==='all'||(mode==='open'?x.category==='attention':mode==='automatic'?['waiting','retrying'].includes(x.category):x.category===mode)}
function render(){const c=snapshot.counts||{},labels={open:'需要处理',review:'资料待复核',automatic:'自动等待',protected:'发送保护',resolved:'已解决',all:'全部记录'},counts={open:c.attention||0,review:c.review||0,automatic:(c.waiting||0)+(c.retrying||0),protected:c.protected||0,resolved:c.resolved||0,all:snapshot.items.length};for(const key of keys){$(key).textContent=labels[key]+' '+counts[key];$(key).classList.toggle('active',key===mode);$(key).setAttribute('aria-pressed',String(key===mode))}
 $('metric-attention').textContent=counts.open;$('metric-review').textContent=counts.review;$('metric-waiting').textContent=counts.automatic;
 const grouped=snapshot.items.filter(inMode),old=$('group').value,groups=new Map();for(const x of grouped)groups.set(x.group||'其他记录',(groups.get(x.group||'其他记录')||0)+1);$('group').innerHTML='<option value="">所有问题类型</option>'+[...groups].map(([name,n])=>`<option value="${E(name)}">${E(name)} · ${n}</option>`).join('');$('group').value=groups.has(old)?old:'';
 const query=$('search').value.trim().toLowerCase(),rows=grouped.filter(x=>(!$('group').value||x.group===$('group').value)&&(!query||[x.company,x.email,x.reason,x.account].join(' ').toLowerCase().includes(query)));page=Math.min(page,Math.max(0,Math.ceil(rows.length/size)-1));
 const explanations={open:'程序、生成与发送结果等需要检查的记录。按问题类型集中处理。',review:'官网未公开合适邮箱、身份待确认或访问受限；这些记录尚未核实成功。',automatic:'按最早复查时间继续；等待中的网站不阻塞其他公司。多次失败会停止自动重复并转为复核。',protected:'已回复、退订、退信及其他保护条件阻止继续联系。',resolved:'只显示已记录解决结果或实际恢复的记录。',all:'全部记录完整保留，包含历史、等待、保护与未解决项。'};$('scope').textContent=explanations[mode];
 $('list').innerHTML=rows.slice(page*size,(page+1)*size).map(x=>`<article class="issue-row"><div class="row"><div class="who">${E(x.company||'未命名客户')}</div><span class="tag ${x.state==='resolved'?'resolved':x.state==='retrying'?'pending':''}">${E(x.category==='waiting'?'等待复查':x.category==='protected'?'发送保护':x.category==='review'?'资料待复核':x.state==='resolved'?'已解决':x.state==='retrying'?'已加入队列':'需要处理')}</span></div><div class="meta">${E(x.account)} · ${E(x.email||'暂无邮箱')} · #${E(x.id)}</div><div class="reason">${E(x.reason||'发送结果需要核实')}</div><div class="row"><span class="meta">${x.category==='waiting'?'最早复查 '+date(x.next_check_at):'首次记录 '+date(x.first_seen)}</span>${x.status==='failed'?`<button data-id="${E(x.id)}" ${busy?'disabled':''}>${x.group==='图片质量复核'?'重做图文':'重新核验'}</button>`:x.status==='unknown'?'<span class="meta">核对发件箱，禁止盲目重发</span>':x.status==='manual'&&x.state!=='resolved'?`<button data-resolve="${E(x.id)}">记录解决结果</button>`:''}</div>${x.resolution?`<p class="meta">${E(x.resolution)}</p>`:''}</article>`).join('')||'<div class="issue-empty">当前范围没有记录。</div>';
 $('page-info').textContent=rows.length?`${page*size+1}–${Math.min((page+1)*size,rows.length)} / ${rows.length}`:'0';$('prev').disabled=page===0;$('next').disabled=(page+1)*size>=rows.length;
 for(const b of document.querySelectorAll('[data-id]'))b.onclick=()=>retry(Number(b.dataset.id));for(const b of document.querySelectorAll('[data-resolve]'))b.onclick=async()=>{const resolution=prompt('记录已验证的解决办法');if(!resolution)return;try{await api('/api/problems/resolve',{id:b.dataset.resolve,resolution});await load()}catch(e){$('notice').textContent=e.message}};
}
async function load(){if(loading)return;loading=true;try{snapshot=await api('/api/problems');render()}catch(e){$('notice').textContent=e.message}finally{loading=false}}
async function retry(id){if(busy)return;busy=true;render();try{await api('/api/redo',{id,what:'problem'});$('notice').textContent='已加入核验队列。账号保持原来的暂停或运行状态，通过发送保护后才会发送。'}catch(e){$('notice').textContent=e.message}finally{busy=false;await load()}}
for(const key of keys)$(key).onclick=()=>{mode=key;page=0;$('group').value='';render()};$('search').oninput=()=>{page=0;render()};$('group').onchange=()=>{page=0;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('refresh').onclick=load;
$('newProblem').onsubmit=async e=>{e.preventDefault();try{await api('/api/problems/add',{title:$('problemTitle').value,detail:$('problemDetail').value});$('newProblem').reset();await load()}catch(err){$('notice').textContent=err.message}};
load();setInterval(()=>{if(!busy&&!document.querySelector('input:focus,select:focus,textarea:focus'))load()},15000);
</script></body></html>
