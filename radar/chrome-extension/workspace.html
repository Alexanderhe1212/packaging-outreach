<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户雷达 · 客户工作台</title><link rel="stylesheet" href="style.css"></head><body data-view="workspace"><main><header><span class="mark">◎</span><div><h1>用户雷达 <span class="subtitle">客户工作台</span></h1><p>从官网出发，把有来源的联系人留下来</p></div></header><p><a href="http://127.0.0.1:18800/radar" target="_blank" rel="noopener">接入 OutreachPilot · 导入待开发 / 开始开发 →</a></p><div id="connection" class="connection" role="status">正在连接本机后台…</div><section class="entry"><label for="website">公司官网</label><div class="input-row"><input id="website" type="url" placeholder="https://company.com"><button id="research" class="primary">查找联系人</button></div><p class="hint">先查官网，再补查公开来源。无需保持官网标签页打开；不读取登录内容，不发送消息。</p></section><div id="message" role="status"></div><section><div class="section-head"><h2>查询进度与结果</h2><button id="refresh" class="quiet">刷新</button></div><div id="jobs"></div></section><section class="customer-section"><div class="section-head"><div><h2>已保存客户</h2><p class="hint">独立客户表 · 自动去重 · 不会自动开发邮件</p></div><button id="export" class="secondary">导出 CSV</button></div><div id="customers"></div></section><footer><p>姓名和具名邮箱齐全即可保存，职位选填。手机及 WhatsApp 必须明确属于本人；没有证据保留空白。业务负责人不等同于已确认的包装采购人。</p></footer></main><script src="app.js"></script></body></html>
